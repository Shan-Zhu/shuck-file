[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shuck-file"
version = "2.0.4"
description = "Any file in, Markdown out — read only what matters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shan" },
]
keywords = ["document", "conversion", "markdown", "pdf", "docx", "xlsx", "pptx", "csv", "mcp", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastmcp>=2.0",
    "python-docx>=0.8.11",
    "pdfplumber>=0.9.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
]

[project.urls]
Homepage = "https://github.com/Shan-Zhu/shuck-file"
Repository = "https://github.com/Shan-Zhu/shuck-file"
Issues = "https://github.com/Shan-Zhu/shuck-file/issues"

[project.scripts]
shuck = "shuck_file.cli:main"
shuck-file = "shuck_file.server:main"

[project.entry-points."mcp.servers"]
shuck-file = "shuck_file.server:mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/shuck_file"]

[tool.pytest.ini_options]
testpaths = ["tests"]
